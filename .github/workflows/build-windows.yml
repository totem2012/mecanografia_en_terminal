name: Build Windows EXE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build executable
        run: >
          pyinstaller
          --onefile
          --console
          --name mecanografia
          --add-data "data/citas.json;data"
          main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mecanografia-windows
          path: dist/mecanografia.exe
          if-no-files-found: error
